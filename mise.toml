# Tool versions managed by mise (https://mise.jdx.dev)
# Used to replace hardcoded version installations in CI/CD pipeline.
#
# Usage in CI:
#   mise install
#   eval "$(mise activate bash)"
#
# Then tools are available directly: node, npm, dotnet

[tools]
node = "24"
dotnet = "10.0.300"  # Must match global.json requirement
