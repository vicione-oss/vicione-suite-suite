# Local backing services for running a ViciOne Suite master/slave setup: the Postgres + RabbitMQ
# (+ Aspire Dashboard) that the master/slave end-to-end tests (Category=E2E-MasterSlave) and local
# master/slave development need. The standalone instance is self-contained (SQLite + in-memory bus) and
# needs none of this. See docs/e2e-testing.md.
#
# Usage:
#   docker compose -f tests/compose.master-slave.yaml up -d
#   # then start the instances via their launch profiles, each in its own terminal:
#   #   dotnet run --project src/Core.OS --launch-profile Master-Ui
#   #   dotnet run --project src/Core.OS --launch-profile Slave1-Ui
#   #   dotnet run --project src/Core.OS --launch-profile Slave2-Ui
#   dotnet test tests/Core.OS.E2E.Tests/Core.OS.E2E.Tests.csproj --filter-query "/[Category=E2E-MasterSlave]"
services:
  postgres:
    image: postgres:17-alpine
    container_name: vicione-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vo-suite
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vo-suite"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: vicione-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Single OTLP ingest point: the instances export to :4317 (as the launch profiles already do) and the
  # collector forwards every signal (traces, metrics, logs) to the Aspire Dashboard. Config below.
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: vicione-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC ingest (instances export here)
      - "4318:4318" # OTLP HTTP ingest
    depends_on:
      - aspire-dashboard

  # OTLP UI for traces, logs and metrics; receives from the collector over the
  # compose network (aspire-dashboard:18889). Browse at http://localhost:18888.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: vicione-aspire-dashboard
    environment:
      # Local dev only: skip the per-start UI login token (also lets the collector push OTLP without a key).
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    ports:
      - "18888:18888" # Dashboard UI
