# OpenTelemetry Collector config for the local master/slave setup: receive OTLP from the Suite instances on the
# standard ports and forward every signal (traces, metrics, logs) to the Aspire Dashboard.
# Wired up by tests/compose.master-slave.yaml.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Plaintext OTLP over the compose network — the dashboard terminates without TLS, so insecure.
  otlp/aspire:
    endpoint: aspire-dashboard:18889
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/aspire]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/aspire]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/aspire]
