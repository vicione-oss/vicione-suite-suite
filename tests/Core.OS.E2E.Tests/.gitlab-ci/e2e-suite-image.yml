# The device-like image every E2E instance runs from: Debian + systemd with the suite installed from
# the real .deb, nginx terminating TLS (Dockerfile.suite-service). One image serves every role, an
# instance picks its own via E2E_ROLE. Which .deb goes in, and the caveats of the shared `:e2e` tag —
# see docs/e2e-testing.md
"Build E2E Image":
  stage: e2e
  image: docker:29.8.0
  services:
    - name: docker:29.8.0-dind
      alias: docker
  timeout: 20m
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
    IMAGE_TAG: $CI_REGISTRY_IMAGE/vicione-suite-e2e:e2e
    # Empty resolves the newest .deb in the registry; the nightly pins it — see e2e-base.yml
    SUITE_DEB_VERSION: ""
  before_script:
    - apk add --no-cache curl jq
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - sh tests/Core.OS.E2E.Tests/.gitlab-ci/download-suite-deb.sh suite.deb "$SUITE_DEB_VERSION"
    - docker build -f tests/Core.OS.E2E.Tests/.gitlab-ci/Dockerfile.suite-service -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  # Infrastructure failures only, never script_failure — see docs/e2e-testing.md
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  rules: !reference [.e2e-rules, rules]
