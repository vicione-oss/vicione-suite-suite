# Master instance: Postgres-backed, seeds the test users, publishes instance state to the bus.
# Activated at boot by e2e-entrypoint.sh into /etc/vicione-suite/conf.d/99-e2e.conf when E2E_ROLE=master.
Instance__Type='Master'
Instance__NamePreload='e2e-master'
Instance__IdPreload='00000000-0000-0000-0000-000000005100'
ConnectionStrings__Postgres='Server=postgres;Port=5432;Database=vo-suite;User Id=postgres;Password=postgres'
UserManagement__SeedTestUsers='true'
MessageBus__UseInMemoryBus='false'
MessageBus__Connection__Host='rabbitmq'
MessageBus__Connection__Port='5672'
MessageBus__Connection__User='suite'
MessageBus__Connection__Pass='suite'
HostManagement__MockClient__DataSource='SystemConfigurationEmbedded'
# The first-run wizard ships enabled and would cover the UI of a freshly initialized instance
# until someone signs in as an admin and leaves it; off, the tests reach the UI directly.
FeatureManagement__FirstRunWizard='false'
# Runtime environment-variable overrides are off unless switched on, and the EnvironmentOverrides
# tests need them on. Each instance runs in its own container, so each keeps its own override file.
VICIONE_SUITE_ENV_OVERRIDES='true'
