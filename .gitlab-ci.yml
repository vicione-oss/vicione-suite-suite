default:
  image: mcr.microsoft.com/dotnet/sdk:9.0

stages:
  - build
  - test
  - artifacts
  - packaging
  - devrelease
  - review
  - deploy
  - release
  - release-public
  - cleanup

include:
  - project: 'vicione-oss/tooling/templates'
    file: '/CI-Templates/v2/dotnet.yml'

  # Registry components for artifact storage
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/upload@v0.1.2
    inputs:
      name: "Upload artifacts arm64"
      stage: artifacts
      file: "artifacts.tar.gz"
      remote_name: "${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-linux-arm64.tar.gz"
      package_name: $PACKAGE_NAME
      rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "web"'
      tags: ["saas-linux-large-arm64"]

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/upload@v0.1.2
    inputs:
      name: "Upload artifacts x64"
      stage: artifacts
      file: "artifacts.tar.gz"
      remote_name: "${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-linux-x64.tar.gz"
      package_name: $PACKAGE_NAME
      rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "web"'

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/cleanup@v0.1.2
    inputs:
      name: "Cleanup old packages"
      stage: cleanup
      package_name: $PACKAGE_NAME
      hours: "4"
      rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule"'

variables:
  PACKAGE_NAME: "ci-artifacts"
  ARTIFACT_PREFIX: "suite"
  DEB_PACKAGING_PROJECT: 'vicione-oss/vicione/suite/deb-packaging'
  DEB_PACKAGING_BRANCH: 'master'

#################### Rules

.rules_default_branch: &rules_default_branch
  if : '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.rules_default_branch_manual: &rules_default_branch_manual
  if : '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: manual
  allow_failure: true

.rules_merge_request: &rules_merge_request
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rules_merge_request_manual: &rules_merge_request_manual
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  when: manual
  allow_failure: true

.rules_web: &rules_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rules_web_manual: &rules_web_manual
  if: '$CI_PIPELINE_SOURCE == "web"'
  when: manual
  allow_failure: true

.rules_tag_manual: &rules_tag_manual
  if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: true

.install_nodejs: &install_nodejs
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt update && apt install -y nodejs

.install_npm_packages: &install_npm_packages
  - npm install

.run_npm_scripts: &run_npm_scripts
  - npm run build

.run_eslint: &run_eslint
  - npx eslint .

#################### Global

before_script:
  - *install_nodejs
  - *install_npm_packages
  - *run_npm_scripts
  - *run_eslint

.patch_version: &patch_version
  - VERSION=undefined
  - if [ ! -z "$CI_COMMIT_REF_NAME" ]; then VERSION=$(sed 's/[^0-9a-zA-Z-]//g' <<< ${CI_COMMIT_SHORT_SHA}-$CI_COMMIT_REF_NAME); fi
  - if [ ! -z "$CI_COMMIT_TAG" ]; then VERSION="$CI_COMMIT_TAG (${CI_COMMIT_SHORT_SHA})"; fi
  - sed -i -E "s/##VERSION_REF##/$VERSION/g" src/Core.OS/version.json

.jfrog-package-release:
  stage: deploy
  image: releases-docker.jfrog.io/jfrog/jfrog-cli-v2-jf
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_DESTINATION: "vicione-suite-dev"
  before_script:
    - apk add --no-cache curl
    - jf config add --user $USER --password ${PASSWORD} --artifactory-url ${SERVER} jfrog
    - jf config use jfrog
  script:
    - APP_PIPELINE="${CI_PIPELINE_ID}"
    - APP_VERSION="$(cat VERSION)"
    - HMS_VERSION="$(cat VERSION_HOSTMANAGEMENT)"
    - APP_TAG="${CI_COMMIT_TAG}"
    - VERSION="${APP_VERSION}"
    - if [[ -z "${APP_TAG}" ]]; then VERSION="${VERSION}~${APP_PIPELINE}"; fi
    - |
      artifacts=(
        "vicione-suite_${VERSION}_amd64.deb"
        "vicione-suite_${VERSION}_arm64.deb"
        "vicione-suite_${VERSION}_amd64_${HMS_VERSION}.json"
        "vicione-suite_${VERSION}_arm64_${HMS_VERSION}.json"
      )
    - |
      printf "%s\n" "${artifacts[@]}" >> artifacts.list

      for artifact in "${artifacts[@]}"; do
        echo "Processing artifact: ${artifact}"

        # Download .deb from Package Registry
        case "${artifact}" in
          *.deb)
            echo "Downloading from Package Registry: ${artifact}"
            curl --fail --silent --show-error \
              --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              --output "${artifact}" \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${APP_PIPELINE}/${artifact}"
            ;;
        esac

        # Create Metadata files
        case "${artifact}" in
          *.json)
            echo "Creating metadata: ${artifact}"
            cat "suite-metadata.json" > "${artifact}"
            ;;
        esac

        # Upload files to JFrog
        case "${artifact}" in
          *.deb|*.json)
            if [ -f "${artifact}" ]; then
              echo "Uploading to JFrog: ${artifact}"
              jf rt upload "${artifact}" "${REPOSITORY_DESTINATION}/suites/${artifact}"
            else
              echo "WARNING: ${artifact} not found locally, skipping upload"
            fi
            ;;
        esac
      done
  artifacts:
    paths:
      - vicione-suite_*.deb
      - artifacts.list
  when: manual
  rules:
    - <<: *rules_merge_request_manual
    - <<: *rules_web_manual

#################### Build stage

Validation:
  stage: build
  script:
    # must be case-sensitive, but gets generated case-insensitive by Visual Studio
    - |
      if grep -i 'nuget.config' src/Core.OS/Dockerfile &> /dev/null; then
        if ! grep 'NuGet.Config' src/Core.OS/Dockerfile &> /dev/null; then
          echo 'wrong casing of "NuGet.Config" in src/Core.OS/Dockerfile';
          grep -i 'nuget.config' src/Core.OS/Dockerfile && false;
        fi
      fi
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

####################  Test stage

xUnit x64:
  variables:
    ARCH: 'x64'
    FILTER: 'Category!=System & Category!=ManualDbTest & Category!=Integration'
  extends: .dotnet-test-xunit
  artifacts:
    reports:
      junit: artifacts/tests/*-test-report.xml

xUnit arm64:
  variables:
    ARCH: 'arm64'
    FILTER: 'Category!=System & Category!=ManualDbTest & Category!=Integration'
  extends: .dotnet-test-xunit
  artifacts:
    reports:
      junit: artifacts/tests/*-test-report.xml
  tags:
    - saas-linux-large-arm64

#################### Artifacts stage

Build artifacts x64:
  stage: artifacts
  variables:
    DOTNET_ARCH: 'linux-x64'
  before_script:
    - !reference [.nuget_credentials]
    - *patch_version
    - *install_nodejs
    - *install_npm_packages
    - *run_npm_scripts
    - *run_eslint
  script:
    - ./build/deploy.sh --create-artifacts --platform 'linux-x64' --environment 'Minimal'
    - du -sh ./artifacts/
    - tar cfz artifacts.tar.gz ./artifacts/ start.sh
    - ls -lh artifacts.tar.gz
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Build artifacts arm64:
  stage: artifacts
  variables:
    DOTNET_ARCH: 'linux-arm64'
  before_script:
    - !reference [.nuget_credentials]
    - *patch_version
    - *install_nodejs
    - *install_npm_packages
    - *run_npm_scripts
    - *run_eslint
  script:
    - ./build/deploy.sh --create-artifacts --platform 'linux-arm64' --environment 'Minimal'
    - du -sh ./artifacts/
    - tar cfz artifacts.tar.gz ./artifacts/ start.sh
    - ls -lh artifacts.tar.gz
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  tags:
    - saas-linux-large-arm64
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

# Upload jobs created by registry component includes above
# Override before_script to avoid global nodejs installation on curlimages/curl
Upload artifacts arm64:
  before_script: []
  needs:
    - job: "Build artifacts arm64"
      artifacts: true

Upload artifacts x64:
  before_script: []
  needs:
    - job: "Build artifacts x64"
      artifacts: true

Versioning:
  stage: artifacts
  before_script: []
  script:
    - echo "APP_PIPELINE=${CI_PIPELINE_ID}" >>version.env
    - echo "APP_VERSION=$(cat VERSION)" >>version.env
    - echo "APP_TAG=${CI_COMMIT_TAG}" >>version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 30 days
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

#################### Packaging stage

trigger deb packaging:
  stage: packaging
  variables:
    APP_PIPELINE: ${APP_PIPELINE}
    APP_VERSION: ${APP_VERSION}
    APP_TAG: ${APP_TAG}
    PARENT_PROJECT_ID: ${CI_PROJECT_ID}
    ARTIFACT_PREFIX: "suite"
  trigger:
    project: ${DEB_PACKAGING_PROJECT}
    branch: ${DEB_PACKAGING_BRANCH}
    strategy: depend
  needs:
    - "Upload artifacts arm64"
    - "Upload artifacts x64"
    - job: "Versioning"
      artifacts: true
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

#################### Review stage

Publish only:
  stage: review
  script:
    - !reference [.nuget_credentials]
    - *patch_version
    # set execution permission
    - chmod +x build/review.sh
    # publish the solution
    - export DEBUG=true
    - build/review.sh --publish-only
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch_manual
    - <<: *rules_merge_request_manual
    - <<: *rules_web_manual
  dependencies: []

Start DigitalOcean:
  stage: review
  script:
    - !reference [.nuget_credentials]
    - *patch_version
    # set execution permission
    - chmod +x build/review.sh
    # create / update the review instance
    - build/review.sh
  artifacts:
    paths:
      - debug.pub
      - debug
    reports:
      dotenv: deploy.env
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch_manual
    - <<: *rules_merge_request_manual
    - <<: *rules_web_manual
  dependencies: []
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://$DROPLET_IP
    on_stop: Stop DigitalOcean
    auto_stop_in: 1 day

Stop DigitalOcean:
  stage: review
  before_script: []
  script:
    # set execution permission
    - chmod +x build/review.sh
    # destroy the environment
    - build/review.sh --stop-review
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch_manual
    - <<: *rules_merge_request_manual
    - <<: *rules_web_manual
  dependencies: []
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop

Cleanup orphanded deployments:
  stage: build
  script:
    # set execution permission
    - chmod +x build/review.sh
    # destroy the environment
    - build/review.sh --cleanup-orphanes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  dependencies: []

Prepare Host for new Snapshot:
  stage: build
  script:
    # set execution permission
    - chmod +x build/review.sh
    # destroy the environment
    - build/review.sh --prepare-snapshot
  rules:
    - if: $PREPARE_SNAPSHOT
  dependencies: []

####################  Deploy stage

Cloud master:
  stage: deploy
  script:
    - !reference [.nuget_credentials]
    - *patch_version
    # set execution permission
    - chmod +x build/deploy.sh
    # create / update the cloud master instance
    - PRESERVE_DATA_PARAM=''
    - if [[ "${PRESERVE_DATA}" == 'true' ]]; then PRESERVE_DATA_PARAM='--preserve-data'; fi;
    - build/deploy.sh --host '159.89.13.71' --environment 'Master' "${PRESERVE_DATA_PARAM}"
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch_manual
    - <<: *rules_merge_request_manual
    - <<: *rules_web_manual
  dependencies: []
  environment:
    name: deployments/cloud-master
    url: https://159.89.13.71
  tags:
    - linux
    - docker
    - x64

