default:
  image: registry.gitlab.com/vicione-oss/tooling/base-image:vicione-stable
  tags:
    - saas-linux-large-amd64
  # Cache configuration provided by cache-config component
  # Jobs should extend .mise-cache or .mise-cache-seed

stages:
  - build
  - test
  - artifacts
  - packaging
  - devrelease
  - review
  - deploy
  - release
  - release-public
  - cleanup

.update_nuget_source_ro: &update_nuget_source_ro
  - dotnet nuget update source JFrogNuGetProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
  - dotnet nuget update source JFrogDevExpressProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text


# Anchors defined before include section so they can be used in component inputs
.activate_mise: &activate_mise
  - export MISE_DATA_DIR="${CI_PROJECT_DIR}/.mise-data"
  - export MISE_DOTNET_ROOT="${MISE_DATA_DIR}/installs/dotnet"
  - mise install
  - eval "$(mise env)"


.install_npm_packages: &install_npm_packages
  - npm install

.run_npm_scripts: &run_npm_scripts
  - npm run build

.run_eslint: &run_eslint
  - npx eslint .

# Rules anchors (defined here so they can be used in component inputs)
.rules_tag_manual: &rules_tag_manual
  if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: true

.rules_default_branch: &rules_default_branch
  if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.rules_merge_request: &rules_merge_request
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rules_web: &rules_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rules_default_branch_manual: &rules_default_branch_manual
  if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: manual
  allow_failure: true

.rules_merge_request_manual: &rules_merge_request_manual
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  when: manual
  allow_failure: true

.rules_web_manual: &rules_web_manual
  if: '$CI_PIPELINE_SOURCE == "web"'
  when: manual
  allow_failure: true

# Common rules list for build/test/upload jobs
.rules_common: &rules_common
  - <<: *rules_tag_manual
  - <<: *rules_default_branch
  - <<: *rules_merge_request
  - <<: *rules_web

# Common rules list for manual deploy/review jobs
.rules_common_manual: &rules_common_manual
  - <<: *rules_tag_manual
  - <<: *rules_default_branch_manual
  - <<: *rules_merge_request_manual
  - <<: *rules_web_manual

include:
  # xUnit test job (both x64 and arm64 via parallel matrix)
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-test@2
    inputs:
      name: 'xUnit'
      stage: 'test'
      no_build: false
      execution_matrix:
        - RUNNER_ARCH: [arm64, amd64]
      tags:
        - saas-linux-large-$RUNNER_ARCH
      image: registry.gitlab.com/vicione-oss/tooling/base-image:vicione-stable
      filter: '/[(Category!=System)&(Category!=ManualDbTest)&(Category!=Integration)]'
      coverage: true
      before_script: [*activate_mise, *update_nuget_source_ro, *install_npm_packages]
      rules: *rules_common



  # Cache configuration component
  # Caches: .mise-data/installs/, .nuget/packages/, node_modules/
  # MISE_DOTNET_ROOT configured to install dotnet inside .mise-data/installs/
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/cache/cache-config@v0.1.1

  # Registry components for artifact storage
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/upload@v0.1.2
    inputs:
      name: "Upload artifacts arm64"
      stage: artifacts
      file: "artifacts.tar.gz"
      remote_name: "${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-linux-arm64.tar.gz"
      package_name: $PACKAGE_NAME
      rules: *rules_common
      tags: ["saas-linux-large-arm64"]

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/upload@v0.1.2
    inputs:
      name: "Upload artifacts x64"
      stage: artifacts
      file: "artifacts.tar.gz"
      remote_name: "${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-linux-x64.tar.gz"
      package_name: $PACKAGE_NAME
      rules: *rules_common

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/cleanup@v0.1.2
    inputs:
      name: "Cleanup old packages"
      stage: cleanup
      package_name: $PACKAGE_NAME
      hours: "4"
      rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule"'
  
  ### Pack
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-pack@v2.4.0
    inputs:
      name: "Pack Core.Artifacts"
      stage: "packaging"
      image: registry.gitlab.com/vicione-oss/tooling/base-image:vicione-stable      
      project: "src/Core.Artifacts/Core.Artifacts.csproj"
      rules: *rules_common_manual
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
        - dotnet restore --packages packages
        - dotnet build src/Core.Artifacts/Core.Artifacts.csproj -c Release --no-restore

  ### Push
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-nuget-push@v2.4.0
    inputs:
      pack_job_name: "Pack Core.Artifacts"
      name: "Push Core.Artifacts"
      stage: "release"
      image: registry.gitlab.com/vicione-oss/tooling/base-image:vicione-stable
      source: "JFrogViciOne"
      filename_pattern: "./src/Core.Artifacts/*"
      rules: *rules_common_manual
      before_script: 
        - *activate_mise
        - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_RW_JFrog -p $NuGet_PW_RW_JFrog --store-password-in-clear-text

variables:
  PACKAGE_NAME: "ci-artifacts"
  ARTIFACT_PREFIX: "suite"
  DEB_PACKAGING_PROJECT: 'vicione-oss/vicione/suite/deb-packaging'
  DEB_PACKAGING_BRANCH: 'master'
  # mise HTTP settings - retry transient network failures with exponential backoff
  MISE_HTTP_TIMEOUT: "60"
  MISE_HTTP_RETRIES: "3"

#################### Cache templates
# Cache configuration provided by component: cache-config@v0.1.1
# Provides .mise-cache (pull) and .mise-cache-seed (pull-push) anchors

#################### Global

# Removed global before_script antipattern
# Jobs now extend appropriate templates based on their needs

# Template for jobs needing dotnet + npm (but not eslint/npm build)
# Used by test jobs that build Blazor projects with SASS/TypeScript
# NOTE: Explicit dotnet restore populates NuGet cache for better performance
.dotnet-npm-build:
  before_script:
    - *activate_mise
    - !reference [.update_nuget_source_ro]
    - *install_npm_packages

# Template for jobs needing mise for deployment scripts
.mise-only:
  before_script:
    - *activate_mise

# Template for jobs with no build requirements
.minimal:
  before_script: []
  cache: []

.patch_version: &patch_version
  - VERSION=undefined
  - if [ ! -z "$CI_COMMIT_REF_NAME" ]; then VERSION=$(sed 's/[^0-9a-zA-Z-]//g' <<< ${CI_COMMIT_SHORT_SHA}-$CI_COMMIT_REF_NAME); fi
  - if [ ! -z "$CI_COMMIT_TAG" ]; then VERSION="$CI_COMMIT_TAG (${CI_COMMIT_SHORT_SHA})"; fi
  - sed -i -E "s/##VERSION_REF##/$VERSION/g" src/Core.OS/version.json

.jfrog-package-release:
  extends: .minimal
  stage: deploy
  image: releases-docker.jfrog.io/jfrog/jfrog-cli-v2-jf
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_DESTINATION: "vicione-suite-dev"
  before_script:
    - apk add --no-cache curl
    - jf config add --user $USER --password ${PASSWORD} --artifactory-url ${SERVER} jfrog
    - jf config use jfrog
  script:
    - APP_PIPELINE="${CI_PIPELINE_ID}"
    - APP_VERSION="$(cat VERSION)"
    - HMS_VERSION="$(cat VERSION_HOSTMANAGEMENT)"
    - APP_TAG="${CI_COMMIT_TAG}"
    - VERSION="${APP_VERSION}"
    - if [[ -z "${APP_TAG}" ]]; then VERSION="${VERSION}~${APP_PIPELINE}"; fi
    - |
      artifacts=(
        "vicione-suite_${VERSION}_amd64.deb"
        "vicione-suite_${VERSION}_arm64.deb"
        "vicione-suite_${VERSION}_amd64_${HMS_VERSION}.json"
        "vicione-suite_${VERSION}_arm64_${HMS_VERSION}.json"
      )
    - |
      printf "%s\n" "${artifacts[@]}" >> artifacts.list

      for artifact in "${artifacts[@]}"; do
        echo "Processing artifact: ${artifact}"

        # Download .deb from Package Registry
        case "${artifact}" in
          *.deb)
            echo "Downloading from Package Registry: ${artifact}"
            curl --fail --silent --show-error \
              --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              --output "${artifact}" \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${APP_PIPELINE}/${artifact}"
            ;;
        esac

        # Create Metadata files
        case "${artifact}" in
          *.json)
            echo "Creating metadata: ${artifact}"
            cat "suite-metadata.json" > "${artifact}"
            ;;
        esac

        # Upload files to JFrog
        case "${artifact}" in
          *.deb|*.json)
            if [ -f "${artifact}" ]; then
              echo "Uploading to JFrog: ${artifact}"
              jf rt upload "${artifact}" "${REPOSITORY_DESTINATION}/suites/${artifact}"
            else
              echo "WARNING: ${artifact} not found locally, skipping upload"
            fi
            ;;
        esac
      done
  artifacts:
    paths:
      - vicione-suite_*.deb
      - artifacts.list
  when: manual
  rules:
    - <<: *rules_merge_request_manual
    - <<: *rules_web_manual
    - <<: *rules_default_branch_manual

Version:
  stage: .pre
  rules:
    - if: '$CI_COMMIT_TAG'
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web
  script:
    - if [[ -f "VERSION" ]]; then VERSION=$(head -n 1 VERSION); fi
    - if [[ ! -z "${CI_COMMIT_TAG}" ]]; then VERSION=$(echo $CI_COMMIT_TAG | sed 's/v//g'); fi
    - if [[ -z "${VERSION}" ]]; then VERSION='0.1.0'; fi
    - if [[ -z "${CI_COMMIT_TAG}" ]]; then VERSION="${VERSION}-ci${CI_PIPELINE_ID}"; fi
    - echo "Version=${VERSION}" >> version.env
    - echo "PackageVersion=${VERSION}" >> version.env
    - echo "APP_PIPELINE=${CI_PIPELINE_ID}" >> version.env
    - echo "APP_VERSION=$(cat VERSION)" >> version.env
    - echo "APP_TAG=${CI_COMMIT_TAG}" >> version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 30 days

Validation:
  extends: .minimal
  stage: test
  script:
    # must be case-sensitive, but gets generated case-insensitive by Visual Studio
    - |
      if grep -i 'nuget.config' src/Core.OS/Dockerfile &> /dev/null; then
        if ! grep 'NuGet.Config' src/Core.OS/Dockerfile &> /dev/null; then
          echo 'wrong casing of "NuGet.Config" in src/Core.OS/Dockerfile';
          grep -i 'nuget.config' src/Core.OS/Dockerfile && false;
        fi
      fi
  rules: *rules_common

####################  Test stage

# Test jobs now defined via dotnet-component includes above
# Old job definitions removed to avoid duplicate job names

#Override needs - Validation job doesn't use parallel matrix
# https://docs.gitlab.com/ci/yaml/matrix_expressions/#matrix-expressions-in-needsparallelmatrix
"xUnit":
  needs: []
  cache:
    - key:
        prefix: mise-${RUNNER_ARCH}-v2
        files:
          - mise.toml
      paths:
        - ${CI_PROJECT_DIR}/.mise-data
      policy: pull-push
    - key:
        prefix: nuget-${RUNNER_ARCH}-v2
        files:
          - Directory.Packages.props
          - global.json
      fallback_keys:
        - nuget-${RUNNER_ARCH}-v2-${CI_DEFAULT_BRANCH}
      paths:
        - .nuget/packages/
        - ./**/obj/
      policy: pull-push

#################### Artifacts stage

Build artifacts x64:
  stage: artifacts
  variables:
    DOTNET_ARCH: 'linux-x64'
    RUNNER_ARCH: amd64
  cache:
    - key:
        prefix: mise-${RUNNER_ARCH}-v2
        files:
          - mise.toml
      paths:
        - ${CI_PROJECT_DIR}/.mise-data
      policy: pull
    - key:
        prefix: nuget-${RUNNER_ARCH}-v2
        files:
          - Directory.Packages.props
          - global.json
      fallback_keys:
        - nuget-${RUNNER_ARCH}-v2-${CI_DEFAULT_BRANCH}
      paths:
        - .nuget/packages/
        - ./**/obj/
      policy: pull
  before_script:
    - *activate_mise
    - !reference [.update_nuget_source_ro]
    - *patch_version
    - *install_npm_packages
    - *run_npm_scripts
    - *run_eslint
  script:
    - ./build/deploy.sh --create-artifacts --platform 'linux-x64' --environment 'Minimal'
    - du -sh ./artifacts/
    - tar cfz artifacts.tar.gz ./artifacts/ start.sh
    - ls -lh artifacts.tar.gz
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  when: manual
  rules: *rules_common

Build artifacts arm64:
  stage: artifacts
  variables:
    DOTNET_ARCH: 'linux-arm64'
    RUNNER_ARCH: arm64
  cache:
    - key:
        prefix: mise-${RUNNER_ARCH}-v2
        files:
          - mise.toml
      paths:
        - ${CI_PROJECT_DIR}/.mise-data
      policy: pull
    - key:
        prefix: nuget-${RUNNER_ARCH}-v2
        files:
          - Directory.Packages.props
          - global.json
      fallback_keys:
        - nuget-${RUNNER_ARCH}-v2-${CI_DEFAULT_BRANCH}
      paths:
        - .nuget/packages/
        - ./**/obj/
      policy: pull
  before_script:
    - *activate_mise
    - !reference [.update_nuget_source_ro]
    - *patch_version
    - *install_npm_packages
    - *run_npm_scripts
    - *run_eslint
  script:
    - ./build/deploy.sh --create-artifacts --platform 'linux-arm64' --environment 'Minimal'
    - du -sh ./artifacts/
    - tar cfz artifacts.tar.gz ./artifacts/ start.sh
    - ls -lh artifacts.tar.gz
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  tags:
    - saas-linux-large-arm64
  when: manual
  rules: *rules_common

# Upload jobs created by registry component includes above
# Override before_script and cache - these jobs don't need mise tools
Upload artifacts arm64:
  before_script: []
  cache: []
  needs:
    - job: "Build artifacts arm64"
      artifacts: true

Upload artifacts x64:
  before_script: []
  cache: []
  needs:
    - job: "Build artifacts x64"
      artifacts: true

#################### Packaging stage

trigger deb packaging:
  stage: packaging
  variables:
    APP_PIPELINE: ${APP_PIPELINE}
    APP_VERSION: ${APP_VERSION}
    APP_TAG: ${APP_TAG}
    PARENT_PROJECT_ID: ${CI_PROJECT_ID}
    ARTIFACT_PREFIX: "suite"
  trigger:
    project: ${DEB_PACKAGING_PROJECT}
    branch: ${DEB_PACKAGING_BRANCH}
    strategy: depend
  needs:
    - "Upload artifacts arm64"
    - "Upload artifacts x64"
    - Version
  when: manual
  rules: *rules_common

#################### Review stage

Publish only:
  extends: .mise-only
  stage: review
  script:
    - !reference [.update_nuget_source_ro]
    - *patch_version
    # set execution permission
    - chmod +x build/review.sh
    # publish the solution
    - export DEBUG=true
    - build/review.sh --publish-only
  rules: *rules_common_manual
  dependencies: []

