spec:
  inputs:
    run_e2e:
      description: 'Run the E2E image build and both E2E jobs automatically and blocking, pinned to this pipeline package.'
      type: string
      default: "false"
      options: ["true", "false"]
    build_packages:
      description: 'Run the chain that produces the .deb automatically instead of manually.'
      type: string
      default: "false"
      options: ["true", "false"]
    cleanup:
      description: 'Run Cleanup old packages, which deletes every ci-artifacts version older than 4 hours.'
      type: string
      default: "false"
      options: ["true", "false"]
---
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - trigger

variables:
  RUN_E2E: "$[[ inputs.run_e2e ]]"
  BUILD_PACKAGES: "$[[ inputs.build_packages ]]"
  CLEANUP: "$[[ inputs.cleanup ]]"

Run pipeline:
  stage: trigger
  variables:
    PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
  trigger:
    include:
      - local: '.gitlab-ci.pipeline.yml'
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
