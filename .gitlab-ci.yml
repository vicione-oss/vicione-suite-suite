Prerelease Packages to JFrog:
  extends: .jfrog-package-release
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_DESTINATION: "vicione-suite-dev"
  needs:
    - "trigger deb packaging"

#################### Release stage

Docker jFrog:
  extends: .dotnet-release-docker
  image: docker:latest
  before_script:
    - apk add --no-cache bash curl sed
  variables:
    DOCKER_HUB: 'jfrog.i40.ifm-datalink.net'
    REPO: 'jfrog.i40.ifm-datalink.net/vicione-docker-local'
    IMAGE_NAME: 'vicionesuite'
    DOCKERFILE: 'src/Core.OS/Dockerfile'
    ARCH: 'x64'
  script:
    - !reference [.nuget_credentials]
    - !reference [.set_version]
    - !reference [.docker_login]
    - *patch_version
    - TAG="${VERSION}"
    - echo "${TAG}"
    - docker buildx create --name mybuilder --use --bootstrap
    - docker buildx build --push --platform linux/amd64,linux/arm64 -t "${REPO}/${IMAGE_NAME}:${TAG}" -f "${DOCKERFILE}" .
    - !reference [.docker_logout]

Release Packages to JFrog:
  extends: .jfrog-package-release
  stage: release
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_DESTINATION: "vicione-suite-staging"
  needs:
    - "trigger deb packaging"
  rules:
    - <<: *rules_tag_manual

#################### Release Public stage

Public-Release Packages to JFrog:
  extends: .jfrog-package-release
  stage: release-public
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_SOURCE: "vicione-suite-staging"
    REPOSITORY_DESTINATION: "vicione-suite"
  script:
    - |
      while IFS= read -r artifact; do
        echo "Processing artifact: ${artifact}"

        # Move to public repository
        case "${artifact}" in
          *.deb|*.json)
            source="${REPOSITORY_SOURCE}/*/${artifact}"
            destination="${REPOSITORY_DESTINATION}/${artifact}"
            echo "Moving artifact: from \"${REPOSITORY_SOURCE}\" to \"${REPOSITORY_DESTINATION}\""
            jf rt mv "${source}" "${destination}"
            ;;
        esac
      done < artifacts.list
  needs:
    - "Release Packages to JFrog"
  rules:
    - <<: *rules_tag_manual

#################### Cleanup stage
# Cleanup job created by registry component include above
