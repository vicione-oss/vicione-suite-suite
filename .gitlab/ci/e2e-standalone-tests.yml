# End-to-end UI tests (Playwright) against a standalone instance of the Suite.
# The Suite is started in the background (seeded test users,
# HTTPS dev cert) and the tests drive a real Chromium browser against it.
# Non-blocking (allow_failure) while the E2E harness is being proven.
#
# The instance runs from a published layout (build/publish-suite.sh) instead of `dotnet run`, so
# static web assets are served the way production serves them (published wwwroot, not the debug
# staticwebassets manifest). appsettings.Development.json is not part of a publish, so all
# instance configuration is passed explicitly as environment variables below.
# See docs/e2e-testing.md.
"E2E Smoke tests (standalone)":
  stage: test
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  needs: []
  allow_failure: true
  # Step down from the default large runner (set in the root `default:`). A single standalone instance
  # plus one headless Chromium browser should fit a medium runner; revert to saas-linux-large-amd64 if
  # the job OOMs (exit 137) or the browser crashes.
  tags:
    - saas-linux-medium-amd64
  variables:
    RUNNER_ARCH: amd64
    SUITE_BASE_URL: "https://localhost:5001"
    # Standalone instance under test (URLs and state directories are set by
    # e2e-start-instance.sh). Development is kept ONLY because the sample modules
    # (Burger, JiTChat) are activated in Development; static assets are served production-style
    # regardless, because the published layout has no appsettings.Development.json and therefore
    # no UseDebugRoot=true.
    ASPNETCORE_ENVIRONMENT: Development
    Instance__Type: Standalone
    UserManagement__SeedTestUsers: "true"
    # Replacements for settings that normally come from appsettings.Development.json (absent from
    # the publish): the in-memory bus (a standalone instance has no RabbitMQ; the published default
    # is false), the deployed module directory inside the publish output, the embedded mock
    # host-management data, and console logging (published default is Journal) so the suite.log
    # artifact captures the instance output.
    MessageBus__UseInMemoryBus: "true"
    ModuleLoader__ModulesPath: Modules
    HostManagement__MockClient__DataSource: SystemConfigurationEmbedded
    Logging__LogTargets__0: Console
    # SUITE_TEST_USERNAME / SUITE_TEST_PASSWORD — the seeded account the login test signs in
    # with — are supplied as masked project CI/CD variables (Settings -> CI/CD -> Variables), not
    # stored here. They must match a user seeded above. See docs/e2e-testing.md.
    SUITE_TEST_USERNAME:
    SUITE_TEST_PASSWORD:
  cache:
    - key:
        prefix: mise-${RUNNER_ARCH}-v2
        files:
          - mise.toml
      paths:
        - ${CI_PROJECT_DIR}/.mise-data
      # pull only: this key is produced (pushed) by the always-running build/test jobs.
      policy: pull
    - key:
        prefix: nuget-${RUNNER_ARCH}-v2
        files:
          - Directory.Packages.props
          - global.json
      fallback_keys:
        - nuget-${RUNNER_ARCH}-v2-${CI_DEFAULT_BRANCH}
      paths:
        - .nuget/packages/
        - ./**/obj/
      # pull only: this key is produced (pushed) by the always-running build/test jobs.
      policy: pull
    - key:
        prefix: node-${RUNNER_ARCH}-v1
        files:
          - package-lock.json
      paths:
        - node_modules/
      policy: pull-push
  before_script:
    - bash .gitlab/ci/scripts/e2e-check-credentials.sh
    # The Playwright image ships browsers but no mise; install it before activating the toolchain.
    - curl -fsSL https://mise.run | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - !reference [.activate_mise]
    - !reference [.update_nuget_source_ro]
    - !reference [.install_npm_packages]
    - !reference [.run_npm_scripts]
    - bash .gitlab/ci/scripts/e2e-prepare.sh
    # Start the standalone instance in the background (role config comes from the job variables
    # above), then poll /hc until it reports healthy — more reliable than waiting for the port to
    # bind, because healthy means the app is actually ready to serve.
    - bash .gitlab/ci/scripts/e2e-start-instance.sh E2E 5000 5001 suite.log &
    - bash .gitlab/ci/scripts/e2e-wait-healthy.sh suite 5001 suite.log 60
  script:
    - dotnet test tests/Core.OS.E2E.Tests/Core.OS.E2E.Tests.csproj --no-build --filter-query "/[Category=E2E]"
  artifacts:
    when: on_failure
    paths:
      - suite.log
      # Playwright failure traces written by the E2E base class (E2ETest). The ** keeps this robust
      # to build config / target framework. Open with `playwright show-trace` or trace.playwright.dev.
      - tests/Core.OS.E2E.Tests/bin/**/traces/*.zip
    expire_in: 1 week
  rules: !reference [.rules_common_manual]
